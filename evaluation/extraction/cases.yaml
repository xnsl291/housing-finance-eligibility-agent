# 문장에서 조건을 뽑는 정확도를 재는 라벨셋
#
# **이 저장소에서 유일하게 측정되지 않던 자리다.** 규칙 엔진 품질은 `golden/`이
# 31건으로 지키지만, LLM이 문장을 얼마나 맞게 읽는지는 수치가 없었다. README에
# 적혀 있던 것은 응답 시간뿐이다.
#
# ── 라벨을 어떻게 정했나 ─────────────────────────────────────────────────
#
# 정답을 임의로 정하지 않았다. `fields.DESCRIPTIONS`에 적힌 정의를 그대로 따랐다.
# 정의가 판단하는 항목은 그 정의가 정답이다. 예를 들어
#
#   marital_status = "혼인 7년 이내면 NEWLYWED"
#   → "결혼 2년차"의 정답은 NEWLYWED다. MARRIED는 틀린 값이다
#
#   is_redevelopment_area_tenant = "**직접 말한 경우만** true"
#   → 말하지 않았으면 뽑지 않는 것이 정답이다
#
# ── expect는 완전해야 한다 ──────────────────────────────────────────────
#
# `expect`에는 **그 문장에서 읽을 수 있는 항목을 전부** 적는다. 빠짐없이 적어야
# "적지 않은 것을 뽑았다"를 환각으로 셀 수 있다. 일부만 적으면 환각률이 실제보다
# 낮게 나온다.
#
# 문장이 정하지 못하는 항목은 적지 않는다. 그 항목이 뽑히면 환각이다.
#
# ── 금액 표기 ───────────────────────────────────────────────────────────
#
# 파서가 만드는 모양 그대로 적는다. 정확한 값은 정수, 범위는 {low, high}다.

cases:
  # ── 여러 항목을 한 문장에서 ────────────────────────────────────────────
  - id: E-01
    왜: 가장 흔한 형태. 이것이 깨지면 나머지를 볼 필요가 없다
    text: 만 29세이고 무주택 세대주입니다. 서울에서 보증금 1억8천짜리 전셋집을 구하고 있습니다.
    expect:
      age: 29
      household_head_status: HEAD
      home_ownership_status: NO_HOME_ALL_MEMBERS
      intended_tenure: JEONSE
      region_name: 서울
      lease_deposit_krw: 180000000

  - id: E-02
    왜: |
      "직장인"은 중소기업 재직 여부를 정하지 못한다. employment_category는
      SME_OR_MID_SIZED와 OTHER 두 값뿐이고 "모름"이 없으므로, 뽑지 않는 것이 정답이다.
      OTHER로 단정하면 병역 특례(만 39세까지) 판단이 조용히 막힌다
    text: 저는 만 31세 직장인이고 세대주입니다. 연봉은 4천만원입니다.
    expect:
      age: 31
      household_head_status: HEAD
      combined_annual_income_krw: 40000000

  # ── 알려진 오독 세 건 ──────────────────────────────────────────────────
  - id: E-03
    왜: |
      2026-09-16 실측에서 모델이 MARRIED로 읽었다. 항목 정의가 "혼인 7년 이내면
      NEWLYWED"이므로 2년차는 NEWLYWED다. 이 한 값이 소득 기준을 5천→7.5천만원으로
      바꿔 통과와 탈락을 가른다
    text: 결혼 2년차 맞벌이입니다. 부부합산 소득은 6천만원이고 경기도 성남에서 전세 2억5천 아파트를 알아보는 중입니다. 자녀는 없습니다.
    expect:
      marital_status: NEWLYWED
      minor_children_count: 0
      combined_annual_income_krw: 60000000
      intended_tenure: JEONSE
      region_name: 경기도 성남시
      lease_deposit_krw: 250000000

  - id: E-04
    왜: |
      2026-09-14 실측에서 "원룸 알아보는 중"을 재개발 구역 세입자 true로 만들었다.
      정의가 "직접 말한 경우만 true"다. 이 값은 소득 기준을 6천만원으로 올린다
    text: 전세 1억짜리 원룸 알아보는 중입니다. 나이는 만 27세예요.
    expect:
      age: 27
      intended_tenure: JEONSE
      lease_deposit_krw: 100000000

  - id: E-05
    왜: |
      2026-09-14 실측에서 "서울 전세 3억"을 주택가격(housing_value_krw)에 넣었다.
      전세보증금과 매매가는 다른 항목이고 보증금 상한 규칙이 전자만 본다
    text: 서울 전세 3억으로 구하고 있습니다.
    expect:
      intended_tenure: JEONSE
      region_name: 서울
      lease_deposit_krw: 300000000

  # ── 한국어 금액 표현 ──────────────────────────────────────────────────
  - id: E-06
    왜: 억과 천만원이 섞인 형태
    text: 순자산은 2억2천2백만원이고 임차보증금은 1억5천만원입니다.
    expect:
      net_asset_krw: 222000000
      lease_deposit_krw: 150000000

  - id: E-07
    왜: 소수점이 든 억 단위
    text: 보증금 1.8억 전세를 보고 있습니다.
    expect:
      intended_tenure: JEONSE
      lease_deposit_krw: 180000000

  - id: E-08
    왜: |
      대략적인 표현은 범위로 읽어야 한다. "4천 후반대"를 한 숫자로 접으면 5천만원
      기준을 통과해 버리는데 원문에는 그런 근거가 없다
    text: 부부합산 소득은 4천 후반대입니다.
    expect:
      combined_annual_income_krw: {low: 45000000, high: 50000000}

  - id: E-09
    왜: |
      2026-09-14에 프롬프트가 "표현을 그대로"라고 지시해 단위 없는 값이 파서에
      안 읽혔다. 프롬프트를 "단위가 빠졌으면 채워 주세요"로 고친 뒤의 자리다
    text: 연 7천 정도 법니다.
    expect:
      combined_annual_income_krw: {low: 63000000, high: 77000000}

  # ── 열거형 값 ────────────────────────────────────────────────────────
  - id: E-10
    왜: 단독세대와 세대원 있음의 구분
    text: 혼자 사는 단독세대주이고 만 24세입니다.
    expect:
      age: 24
      household_type: SINGLE
      household_head_status: HEAD

  - id: E-11
    왜: 아직 세대주가 아닌 경우. 청년전용은 예비 세대주도 되고 일반은 안 된다
    text: 지금은 부모님과 살고 있어서 세대주가 아니고, 이사하면서 세대주가 될 예정입니다.
    expect:
      household_head_status: PROSPECTIVE_HEAD

  - id: E-12
    왜: 유주택은 다른 조건과 무관하게 탈락시키는 값이다
    text: 제 이름으로 된 집이 한 채 있습니다. 만 40세입니다.
    expect:
      age: 40
      home_ownership_status: HAS_HOME

  - id: E-13
    왜: 미혼을 신혼이나 기혼으로 읽으면 소득 기준이 잘못 올라간다
    text: 미혼이고 자녀는 없습니다.
    expect:
      marital_status: SINGLE
      minor_children_count: 0

  - id: E-14
    왜: 자녀 수가 2명 이상이면 소득 기준이 6천만원으로 올라간다
    text: 결혼했고 미성년 자녀가 둘 있습니다. 혼인은 10년 됐습니다.
    expect:
      marital_status: MARRIED
      minor_children_count: 2

  - id: E-15
    왜: 중소기업 재직과 병역을 함께 말한 경우. 둘이 모두 있어야 나이 상한이 늘어난다
    text: 중소기업에 다니고 있고 군 복무는 2년 했습니다. 만 36세입니다.
    expect:
      age: 36
      employment_category: SME_OR_MID_SIZED
      military_service_years: 2

  - id: E-16
    왜: 혁신도시는 직접 말했으므로 true가 정답이다. E-04의 짝이다
    text: 혁신도시로 이전한 공공기관에서 일하고 있습니다.
    expect:
      is_innovation_city_relocated_worker: true

  # ── 숫자·날짜 ────────────────────────────────────────────────────────
  - id: E-17
    왜: 전용면적은 제곱미터로 읽어야 한다
    text: 전용면적 59제곱미터 아파트입니다.
    expect:
      housing_area_m2: 59.0

  - id: E-18
    왜: 평은 제곱미터가 아니다. 환산을 모델에게 맡기면 판정이 틀어진다
    text: 25평 아파트를 보고 있습니다.
    expect: {}

  - id: E-19
    왜: 비율은 0에서 1 사이로 읽어야 한다
    text: 보증금의 10퍼센트를 이미 냈습니다.
    expect:
      deposit_paid_ratio: 0.1

  - id: E-20
    왜: 날짜 세 개가 신청 기한 판정에 함께 쓰인다
    text: 잔금은 2026년 3월 10일에 치르고 전입은 4월 20일에 할 예정이며 대출은 5월 1일에 신청하려고 합니다.
    expect:
      contract_balance_date: "2026-03-10"
      move_in_date: "2026-04-20"
      application_date: "2026-05-01"

  # ── 지역 ────────────────────────────────────────────────────────────
  - id: E-21
    왜: |
      수도권 여부를 뽑게 하지 않는다. 지역명만 그대로 받고 수도권 분류는 코드가 한다
      (2026-09-14에 모델이 "경기도"를 비수도권으로 계속 읽어 코드로 내렸다)
    text: 경기도 수원시에 있는 집을 구하고 있습니다.
    expect:
      region_name: 경기도 수원시

  - id: E-22
    왜: 비수도권. 보증금 상한이 2억으로 낮아진다
    text: 부산에서 전세 2억5천을 알아보고 있습니다.
    expect:
      intended_tenure: JEONSE
      region_name: 부산
      lease_deposit_krw: 250000000

  # ── 아무것도 뽑지 말아야 하는 경우 ────────────────────────────────────
  - id: E-23
    왜: |
      **값이 하나뿐인 문장이다.** 2026-09-22에는 "뽑을 게 하나도 없는 문장"으로 두고
      환각률 기준선으로 썼는데, #18이 `intended_tenure`를 만든 뒤로는 "전세 대출"이
      그 항목을 정한다. 기준선 역할은 E-25로 옮기고 이 케이스는 **다른 것에 끌려가지
      않고 하나만 뽑는가**를 본다
    text: 전세 대출을 받고 싶은데 어떻게 해야 하는지 잘 모르겠습니다.
    expect:
      intended_tenure: JEONSE

  - id: E-25
    왜: |
      판정에 쓸 값이 하나도 없는 문장이다. **무언가를 뽑으면 전부 환각이다.**
      이 케이스가 환각률을 재는 기준선이 된다 — E-23이 맡고 있던 역할인데, 항목이
      늘면서 그 문장이 값을 하나 갖게 돼 따로 세웠다.
      **항목을 늘릴 때는 이 케이스의 문장도 다시 봐야 한다.** 늘어난 항목을 이 문장이
      정하게 되면 기준선이 또 조용히 사라진다
    text: 대출을 받고 싶은데 절차가 어떻게 되는지 알려 주세요.
    expect: {}

  # ── 매매 (디딤돌) ─────────────────────────────────────────────────────
  #
  # **2026-10-02에 추가했다.** #18에서 매매 상품을 넣었는데 이 평가셋에 매매 문장이
  # 하나도 없어서 `housing_value_krw`와 `is_first_time_buyer`가 한 번도 측정되지
  # 않고 있었다. 전세만 재면서 "추출 정확도"라고 부르고 있었다.
  - id: E-26
    왜: 매매의 기본 형태. 주택가격·생애최초·전세냐 매매냐가 한 문장에 있다
    text: 생애 처음으로 집을 사려고 합니다. 서울에서 5억짜리 아파트를 보고 있고 만 34세입니다.
    expect:
      age: 34
      intended_tenure: PURCHASE
      is_first_time_buyer: true
      housing_value_krw: 500000000
      region_name: 서울

  - id: E-27
    왜: |
      매매가와 전세보증금은 다른 항목이고 보증금 상한 규칙은 후자만 본다. E-05의
      짝이다 — 거기서는 "전세 3억"이 주택가격으로 잘못 갔다. 반대 방향도 막아야 한다
    text: 집을 사려고 하는데 매매가는 3억입니다.
    expect:
      intended_tenure: PURCHASE
      housing_value_krw: 300000000

  - id: E-28
    왜: |
      **전세냐 매매냐를 말하지 않은 문장이다.** 이 항목이 뽑히면 환각이고, 질문 루프가
      1순위로 물어야 하는 항목이라 잘못 채워지면 후보 상품이 조용히 반으로 줄어든다
    text: 만 30세이고 연봉 4천만원입니다. 서울에 살아요.
    expect:
      age: 30
      combined_annual_income_krw: 40000000
      region_name: 서울

  - id: E-24
    왜: 개인정보가 섞인 경우. 값은 정상적으로 뽑되 주민번호는 경고로만 남아야 한다
    text: 만 30세이고 주민번호는 900101-1234567입니다. 연봉 4500만원입니다.
    expect:
      age: 30
      combined_annual_income_krw: 45000000
    expect_warning: 주민등록번호

# 같은 문장을 여러 번 넣어 값이 흔들리는지 본다.
#
# temperature를 0으로 둔 것은 설정일 뿐이고, 실제로 같은 답이 나오는지는 재 봐야
# 안다. 판정이 규칙으로 결정적이어도 **입력이 흔들리면 결과가 흔들린다.**
consistency:
  repeat: 3
  case_ids: [E-01, E-03, E-04, E-08, E-23]

# 이 평가셋이 **일부러 다루지 않는** 항목.
#
# 2026-10-02에 둔 장치다. #18이 `intended_tenure`를 만들었는데 라벨을 안 늘려서,
# 맞게 뽑은 값이 환각으로 집계되고 있었다(환각률 2.0%가 16.0%로 보였다). 같은 일이
# 다시 생기지 않게 **항목이 하나 늘면 테스트가 분류를 요구한다**
# (`tests/test_extraction_cases.py`).
#
# 여기 적으면 "안 재기로 정했다"는 뜻이다. 이유 없이 적어서 통과시키면 장치가 무의미하다.
uncovered_fields:
  is_redevelopment_area_tenant: |
    긍정 사례를 두지 않는다. 정의가 "직접 말한 경우만 true"이고, 말하지 않았는데 뽑는
    것을 막는 쪽이 중요하다. E-04가 그 역할을 한다(원룸 이야기를 이 값으로 읽지 않는가)
