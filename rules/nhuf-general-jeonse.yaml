# 버팀목전세자금 (일반) — 자격 규칙
#
# 청년전용(nhuf-youth-jeonse.yaml)과 다른 상품이다. 나이 상한이 없고, 대신
# 보증금 상한과 대출한도가 수도권과 수도권 외로 갈린다.
#
# human_reviewed가 false인 규칙은 판정에 쓰지 않는다.

program:
  program_id: nhuf-general-jeonse
  organization: 주택도시기금
  program_name: 버팀목전세자금
  program_type: LOAN
  source_url: https://nhuf.molit.go.kr/FP/FP05/FP0502/FP05020101.jsp
  fetched_at: "2026-09-08"
  version: 1
  status: ACTIVE

rules:
  # 원문은 "민법상 성년"이라고만 적혀 있고 숫자가 없다. 만 19세로 해석했으나
  # 원문에 없는 값이므로 검수 항목이다.
  - rule_id: N-01
    field: age
    operator: gte
    value: 19
    unit: 세
    type: HARD
    citation: "대출접수일 현재 민법상 성년인 세대주"
    human_reviewed: false
    failure_message: 민법상 성년이 아니면 신청 대상이 아님
    note: 원문에 나이 숫자가 없다. 민법상 성년을 만 19세로 해석한 값이다.

  - rule_id: N-02
    field: household_head_status
    operator: eq
    value: HEAD
    type: HARD
    citation: "대출접수일 현재 민법상 성년인 세대주"
    human_reviewed: false
    failure_message: 세대주여야 함
    note: 청년전용과 달리 예비 세대주 문구가 원문에 없다.

  - rule_id: N-03
    field: home_ownership_status
    operator: eq
    value: NO_HOME_ALL_MEMBERS
    type: HARD
    citation: "세대주를 포함한 세대원 전원이 무주택인 자"
    human_reviewed: false
    failure_message: 세대원 중 주택을 보유한 사람이 있으면 신청 대상이 아님

  # 소득 기준. N-05·N-06이 특례이고 N-04가 일반이다.
  - rule_id: N-04
    field: combined_annual_income_krw
    operator: lte
    value: 50000000
    unit: 원
    type: HARD
    citation: "대출신청인과 배우자의 합산 총소득이 연간 5천만원 이하인 자"
    human_reviewed: false
    failure_message: 부부합산 총소득이 5천만원을 넘음

  - rule_id: N-05
    field: combined_annual_income_krw
    operator: lte
    value: 60000000
    unit: 원
    type: HARD
    applies_when:
      field: minor_children_count
      operator: gte
      value: 2
    overrides: [N-04]
    citation: "단, 혁신도시 이전 공공기관 종사자, 타 지역으로 이주하는 재개발 구역내 세입자, 위험건축물 이주지원 대상자, 다자녀가구, 2자녀 가구인 경우 6천만원 이하"
    human_reviewed: false
    failure_message: 2자녀 이상 가구 기준 6천만원을 넘음
    note: |
      원문의 6천만원 대상은 다섯 갈래다. 자녀 수로 판정할 수 있는 것은
      다자녀·2자녀뿐이고, 혁신도시 이전 공공기관 종사자·재개발 구역 세입자·
      위험건축물 이주지원 대상자는 신청자 프로필에 해당 항목이 없어 다루지 못한다.
      항목을 추가할지 검수 때 정한다.

  - rule_id: N-06
    field: combined_annual_income_krw
    operator: lte
    value: 75000000
    unit: 원
    type: HARD
    applies_when:
      field: marital_status
      operator: eq
      value: NEWLYWED
    overrides: [N-04]
    citation: "신혼부부인 경우는 7.5천만원 이하"
    human_reviewed: false
    failure_message: 신혼부부 기준 7.5천만원을 넘음

  - rule_id: N-07
    field: net_asset_krw
    operator: lte
    value: 345000000
    unit: 원
    type: HARD
    citation: "합산 순자산 가액이 소득 3분위 전체가구 평균값 이하 / 2026년도 기준 3.45억원"
    human_reviewed: false
    failure_message: 순자산이 3.45억원을 넘음
    note: 연도마다 바뀌는 값이다. 해가 바뀌면 원문을 다시 확인한다.

  - rule_id: N-08
    field: housing_area_m2
    operator: lte
    value: 85
    unit: ㎡
    type: HARD
    citation: "전용면적 85㎡ 이하"
    human_reviewed: false
    failure_message: 전용면적이 85㎡를 넘음

  # 보증금 상한은 지역으로 갈린다. 일반 규칙 없이 조건부 규칙 둘만 둔다.
  # 지역을 모르면 어느 쪽도 적용되지 않아 "정보 부족"으로 끝난다. 의도한 동작이다 —
  # 지역을 모른 채 한쪽 기준을 임의로 적용하면 틀린 판정이 나온다.
  - rule_id: N-09
    field: lease_deposit_krw
    operator: lte
    value: 300000000
    unit: 원
    type: HARD
    applies_when:
      field: region
      operator: eq
      value: CAPITAL_AREA
    citation: "일반가구: 수도권 3억원, 수도권외 2억원"
    human_reviewed: false
    failure_message: 수도권 기준 임차보증금 3억원을 넘음

  - rule_id: N-10
    field: lease_deposit_krw
    operator: lte
    value: 200000000
    unit: 원
    type: HARD
    applies_when:
      field: region
      operator: eq
      value: NON_CAPITAL_AREA
    citation: "일반가구: 수도권 3억원, 수도권외 2억원"
    human_reviewed: false
    failure_message: 수도권 외 기준 임차보증금 2억원을 넘음

limits:
  loan_amount:
    rule_id: N-11
    by_region:
      CAPITAL_AREA: 120000000
      NON_CAPITAL_AREA: 80000000
    citation: "일반가구: 수도권 1.2억원, 수도권 외 8천만원"
    human_reviewed: false
    note: 청년전용과 달리 전세금액 대비 비율 상한이 원문에 나오지 않았다.

information:
  - rule_id: N-12
    label: 대출금리
    value: "연 2.5% ~ 3.5% (변동금리)"
    citation: "연 2.5%~3.5%"
    human_reviewed: false
  - rule_id: N-13
    label: 대출기간
    value: "2년 이내, 임차종료일 초과 불가, 최장 10년"
    citation: "2년 이내. 단, 임차종료일을 초과할 수 없음(최장 10년 가능)"
    human_reviewed: false

unresolved:
  - "원문이 '민법상 성년'이라고만 적고 나이 숫자가 없음. 만 19세로 해석했음"
  - "보증금 상한과 대출한도가 '일반가구' 기준으로만 적혀 있음. 신혼·다자녀 가구 값은 페이지에서 확인 못 함"
  - "6천만원 소득 특례 다섯 갈래 중 세 갈래(혁신도시 이전 공공기관 종사자, 재개발 구역 세입자, 위험건축물 이주지원 대상자)는 신청자 프로필에 해당 항목이 없어 다루지 못함"
  - "총소득이 세전인지 세후인지 페이지에 없음. 청년전용과 같은 문제임"
  - "수도권의 범위가 페이지에 정의돼 있지 않음. 서울·경기·인천으로 볼지 확인 필요"
