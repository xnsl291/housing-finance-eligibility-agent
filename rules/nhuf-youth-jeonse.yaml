# 청년전용 버팀목전세자금 — 자격 규칙
#
# 이 파일은 판정 로직이 아니라 데이터다. 조건이 바뀌면 코드가 아니라 이 파일을 고친다.
#
# human_reviewed가 false인 규칙은 판정에 쓰지 않는다. LLM이 문서에서 뽑은 후보일 뿐이고,
# 사람이 원문과 대조해 확인해야 true가 된다. "이하"와 "미만", "이전"과 "이내"처럼
# 한 글자 차이로 결과가 갈리는 조건이 많아 이 단계를 건너뛰지 않는다.
#
# 검수용 표: portfolio-private 저장소 finance-agent/2026-09-08-규칙후보-검수표.md

program:
  program_id: nhuf-youth-jeonse
  organization: 주택도시기금
  program_name: 청년전용 버팀목전세자금
  program_type: LOAN
  source_url: https://nhuf.molit.go.kr/FP/FP05/FP0502/FP05020301.jsp
  fetched_at: "2026-09-08"
  version: 2
  status: ACTIVE
  # 값이 두 곳에서 일치하는 것을 확인함. 주택도시기금 공식 페이지와
  # KB국민은행 상품안내(obank.kbstar.com/quics?page=C060283)임. 검수 기록은
  # portfolio-private 저장소 finance-agent/2026-09-08-검수표-v2.md에 있음.
  reviewed_at: "2026-09-08"
  reviewed_note: 기금 공식 페이지와 은행 상품안내 두 곳에서 값 일치 확인

# 통과·불통과를 가르는 조건.
#
# overrides가 있는 규칙은 특례다. applies_when이 맞으면 그 규칙이 적용되고
# overrides에 적힌 일반 규칙은 건너뛴다. 일반 규칙 쪽에 "특례가 아닐 때"라는
# 부정 조건을 적지 않기 위한 장치다. 부정 조건을 양쪽에 적으면 특례가 늘 때마다
# 일반 규칙도 같이 고쳐야 하고, 한쪽만 고치면 두 규칙이 동시에 걸린다.
rules:
  - rule_id: B-01
    field: age
    operator: gte
    value: 19
    unit: 세
    type: HARD
    citation: "만 19세 이상 ∼ 만 34세 이하의 세대주(예비 세대주 포함)"
    human_reviewed: true
    failure_message: 만 19세 미만은 신청 대상이 아님

  - rule_id: B-02
    field: age
    operator: lte
    value: 34
    unit: 세
    type: HARD
    citation: "만 19세 이상 ∼ 만 34세 이하의 세대주(예비 세대주 포함)"
    human_reviewed: true
    failure_message: 만 34세를 넘으면 신청 대상이 아님
    note: |
      병역 특례가 있다. 중소·중견기업 재직자 등이 병역의무를 이행한 경우
      만 34세 종료일에 복무기간을 더해 최대 만 39세까지 신청할 수 있다.
      신청자 정보에 재직 형태와 복무기간 항목이 없어 이번 범위에서 다루지 않는다.
      해당자는 이 규칙에서 잘못 탈락한다.

  - rule_id: B-03
    field: household_head_status
    operator: in
    value: [HEAD, PROSPECTIVE_HEAD]
    type: HARD
    citation: "만 19세 이상 ∼ 만 34세 이하의 세대주(예비 세대주 포함)"
    human_reviewed: true
    failure_message: 세대주 또는 예비 세대주여야 함

  - rule_id: B-04
    field: home_ownership_status
    operator: eq
    value: NO_HOME_ALL_MEMBERS
    type: HARD
    citation: "세대주를 포함한 세대원 전원이 무주택인 자"
    human_reviewed: true
    failure_message: 세대원 중 주택을 보유한 사람이 있으면 신청 대상이 아님

  # 소득 기준 세 단. B-06·B-07이 특례이고 B-05가 일반이다.
  - rule_id: B-05
    field: combined_annual_income_krw
    operator: lte
    value: 50000000
    unit: 원
    type: HARD
    citation: "대출신청인과 배우자의 합산 총소득이 5천만원 이하인 자"
    human_reviewed: true
    failure_message: 부부합산 총소득이 5천만원을 넘음

  - rule_id: B-06
    field: combined_annual_income_krw
    operator: lte
    value: 60000000
    unit: 원
    type: HARD
    overrides: [B-05]
    applies_when:
      any:
        - field: minor_children_count
          operator: gte
          value: 2
        - field: is_innovation_city_relocated_worker
          operator: eq
          value: true
        - field: is_redevelopment_area_tenant
          operator: eq
          value: true
    citation: "다자녀·2자녀가구는 6천만원 이하 / 혁신도시 이전 공공기관 종사자·타 지역으로 이주하는 재개발 구역 내 세입자는 6천만원 이하"
    human_reviewed: true
    failure_message: 2자녀 이상 가구 등 특례 기준 6천만원을 넘음

  - rule_id: B-07
    field: combined_annual_income_krw
    operator: lte
    value: 75000000
    unit: 원
    type: HARD
    applies_when:
      field: marital_status
      operator: eq
      value: NEWLYWED
    overrides: [B-05]
    citation: "신혼가구는 7.5천만원 이하"
    human_reviewed: true
    failure_message: 신혼가구 기준 7.5천만원을 넘음

  - rule_id: B-08
    field: net_asset_krw
    operator: lte
    value: 345000000
    unit: 원
    type: HARD
    citation: "합산 순자산 가액이 통계청에서 발표하는 최근년도 가계금융복지조사의 소득 3분위 전체가구 평균값 이하(십만원 단위에서 반올림)인 자 / 2026년도 기준 3.45억원"
    human_reviewed: true
    effective_year: 2026
    failure_message: 순자산이 3.45억원을 넘음
    note: 매년 바뀌는 값이다. effective_year가 지나면 원문을 다시 확인한다.

  # 전용면적 두 단. B-10이 특례이고 B-09가 일반이다.
  - rule_id: B-09
    field: housing_area_m2
    operator: lte
    value: 85
    unit: ㎡
    type: HARD
    citation: "임차 전용면적 85㎡ 이하 주택"
    human_reviewed: true
    failure_message: 전용면적이 85㎡를 넘음

  - rule_id: B-10
    field: housing_area_m2
    operator: lte
    value: 60
    unit: ㎡
    type: HARD
    applies_when:
      all:
        - field: age
          operator: lt
          value: 25
        - field: household_type
          operator: eq
          value: SINGLE
    overrides: [B-09]
    citation: "만 25세 미만 단독세대주는 60㎡ 이하"
    human_reviewed: true
    failure_message: 만 25세 미만 단독세대주는 전용면적 60㎡ 이하만 가능함

  - rule_id: B-11
    field: lease_deposit_krw
    operator: lte
    value: 300000000
    unit: 원
    type: HARD
    citation: "임차보증금 3억원 이하"
    human_reviewed: true
    failure_message: 임차보증금이 3억원을 넘음
    note: 청년전용은 지역 구분이 없다. 일반 버팀목은 수도권과 그 외로 갈린다.

  - rule_id: B-17
    field: deposit_paid_ratio
    operator: gte
    value: 0.05
    unit: 비율
    type: HARD
    citation: "만 19세~34세 이하의 세대주 및 세대주예정자로 주택임대차계약을 체결하여 임차보증금의 5% 이상 지불하고"
    human_reviewed: true
    failure_message: 임차보증금의 5% 이상을 지불한 상태여야 함
    note: 기금 공식 페이지에는 없고 은행 상품안내에서 확인한 조건이다.

  # 신청 시기. 기준 날짜가 둘이고 **빠른 날**을 쓴다. HUG 전세보증금반환보증은
  # 같은 두 날짜에서 늦은 날을 쓰므로 헷갈리기 쉬운 자리다.
  - rule_id: B-18
    field: application_date
    operator: within_months_after
    value: 3
    unit: 개월
    reference:
      mode: earliest
      fields: [contract_balance_date, move_in_date]
    type: HARD
    citation: "신규계약: 임대차계약서상 잔금지급일과 주민등록등본상 전입일중 빠른 날로부터 3개월 이내"
    human_reviewed: true
    failure_message: 신청 기한(잔금지급일과 전입일 중 빠른 날로부터 3개월)이 지남
    note: |
      증액갱신계약은 갱신계약일로부터 3개월 이내로 기준이 다르다. 계약 유형을
      나누는 규칙은 아직 넣지 않았고 신규계약만 다룬다.
      기존 은행재원 전세자금대출 대환이면서 부부합산 연소득 5천만원 이하면
      6개월 이내로 늘어나는 특례도 아직 다루지 않는다.

  # 병역 특례. 만 34세 종료일에 복무기간을 더하되 만 39세가 상한이다.
  # 나이 기준을 사람마다 바꾸는 대신 복무기간만큼 되돌린 나이를 비교한다
  # (profile.enrich가 age_after_service_credit을 만든다).
  - rule_id: B-19
    field: age_after_service_credit
    operator: lte
    value: 34
    unit: 세
    type: HARD
    applies_when:
      all:
        - field: employment_category
          operator: eq
          value: SME_OR_MID_SIZED
        - field: military_service_years
          operator: gte
          value: 1
    overrides: [B-02]
    citation: "병역법에 따라 병역의무를 이행한 경우 만 34세 종료일로부터 병역 복무기간을 추가하여 최대 만 39세까지 신청 가능"
    human_reviewed: true
    failure_message: 병역 복무기간을 더해도 나이 상한을 넘음

  - rule_id: B-20
    field: age
    operator: lte
    value: 39
    unit: 세
    type: HARD
    applies_when:
      all:
        - field: employment_category
          operator: eq
          value: SME_OR_MID_SIZED
        - field: military_service_years
          operator: gte
          value: 1
    citation: "최대 만 39세까지 신청 가능"
    human_reviewed: true
    failure_message: 병역 특례를 적용해도 만 39세를 넘을 수 없음
    note: |
      B-19와 함께 걸린다. B-19는 복무기간만큼 되돌린 나이를 보고 B-20은 상한을 본다.
      소속기업이 게임업·주점 등 사행성업종이거나 공무원·공기업이면 특례 대상이
      아닌데, 그 구분은 아직 다루지 않는다.

# 통과·불통과가 아니라 금액을 구하는 값. 판정 엔진이 아니라 계산기가 쓴다.
limits:
  # 비율 상한과 금액 상한을 둘 다 걸고 작은 쪽을 쓴다. 원문이 "임차보증금의 80%
  # 이내에서 최고 1억 5천만원 이내"라고 적어 둘이 함께 걸린다(은행 상품안내에서 확인).
  #
  # tiers는 위에서부터 applies_when이 맞는 첫 칸을 쓴다. applies_when이 없는 칸은
  # 항상 맞으므로 맨 아래에 둔다. 적용 여부를 판단할 값이 없으면 아래 칸으로
  # 내려가지 않고 계산을 포기한다 — 특례가 걸릴지 모르는 채로 일반 기준을 쓰면
  # 실제보다 큰 금액을 알려 주게 된다.
  loan_amount:
    rule_id: B-12
    apply: MIN_OF_CAP_AND_RATIO
    citation: "임차보증금의 80%이내에서 최고 1억 5천만원 이내 / 단, 만 25세 미만 단독세대주(단독세대주 예정자 포함)는 임차보증금의 80% 이내에서 최고 1억 2천만원 이내"
    human_reviewed: true
    tiers:
      - name: under_25_single
        applies_when:
          all:
            - field: age
              operator: lt
              value: 25
            - field: household_type
              operator: eq
              value: SINGLE
        ratio_of_deposit: 0.80
        cap_krw: 120000000
      - name: default
        ratio_of_deposit: 0.80
        cap_krw: 150000000

# 판정에 쓰지 않고 안내로만 보여 주는 값.
information:
  - rule_id: B-15
    label: 대출금리
    value: "연 2.2% ~ 3.3%"
    citation: "연 2.2%~3.3%"
    human_reviewed: true
  - rule_id: B-16
    label: 대출기간
    value: "2년 이내, 최장 10년"
    citation: "2년 이내(최장 10년 이용 가능)"
    human_reviewed: true

# 원문에서 확인하지 못한 것. 채워지기 전까지 판정에서 다루지 않는다.
# 총소득은 세전으로 확정함(2026-09-09 사용자 확인). 원문에는 "근로소득(상여금 및
# 수당포함) 및 사업소득"이라는 정의만 있고 세전·세후 표기가 없었다.
income_basis:
  value: BEFORE_TAX
  citation: "부부합산 총소득이란 차주 및 배우자(결혼예정자 포함)의 근로소득(상여금 및 수당포함) 및 사업소득을 말함"
  human_reviewed: true
  note: 원문에 세전이라는 표기는 없다. 근로소득·사업소득 개념이라는 점과 실무 기준으로 확정했다.

unresolved:
  - "증액갱신계약은 갱신계약일로부터 3개월 이내로 기준이 다름. 계약 유형을 나누는 규칙을 아직 넣지 않아 신규계약만 다룸"
  - "증액갱신계약의 1년 이상 거주 요건(공공임대 3개월)은 다루지 않음"
  - "대환 시 연소득 5천만원 이하면 신청 기한이 6개월로 늘어나는 특례를 다루지 않음"
  - "병역 특례에서 소속기업이 사행성업종이거나 공무원·공기업이면 제외되는데 그 구분을 다루지 않음"
  - "6천만원 소득 특례 중 위험건축물 이주지원 대상자는 항목이 없어 다루지 않음"
