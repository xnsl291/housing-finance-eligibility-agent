# 청년전용 버팀목전세자금 — 자격 규칙
#
# 이 파일은 판정 로직이 아니라 데이터다. 조건이 바뀌면 코드가 아니라 이 파일을 고친다.
#
# human_reviewed가 false인 규칙은 판정에 쓰지 않는다. LLM이 문서에서 뽑은 후보일 뿐이고,
# 사람이 원문과 대조해 확인해야 true가 된다. "이하"와 "미만", "이전"과 "이내"처럼
# 한 글자 차이로 결과가 갈리는 조건이 많아 이 단계를 건너뛰지 않는다.
#
# 검수용 표: portfolio-private 저장소 finance-agent/2026-09-08-규칙후보-검수표.md

program:
  program_id: nhuf-youth-jeonse
  organization: 주택도시기금
  program_name: 청년전용 버팀목전세자금
  program_type: LOAN
  source_url: https://nhuf.molit.go.kr/FP/FP05/FP0502/FP05020301.jsp
  fetched_at: "2026-09-08"
  version: 1
  status: ACTIVE

# 통과·불통과를 가르는 조건.
#
# overrides가 있는 규칙은 특례다. applies_when이 맞으면 그 규칙이 적용되고
# overrides에 적힌 일반 규칙은 건너뛴다. 일반 규칙 쪽에 "특례가 아닐 때"라는
# 부정 조건을 적지 않기 위한 장치다. 부정 조건을 양쪽에 적으면 특례가 늘 때마다
# 일반 규칙도 같이 고쳐야 하고, 한쪽만 고치면 두 규칙이 동시에 걸린다.
rules:
  - rule_id: B-01
    field: age
    operator: gte
    value: 19
    unit: 세
    type: HARD
    citation: "만 19세 이상 ∼ 만 34세 이하의 세대주(예비 세대주 포함)"
    human_reviewed: false
    failure_message: 만 19세 미만은 신청 대상이 아님

  - rule_id: B-02
    field: age
    operator: lte
    value: 34
    unit: 세
    type: HARD
    citation: "만 19세 이상 ∼ 만 34세 이하의 세대주(예비 세대주 포함)"
    human_reviewed: false
    failure_message: 만 34세를 넘으면 신청 대상이 아님

  - rule_id: B-03
    field: household_head_status
    operator: in
    value: [HEAD, PROSPECTIVE_HEAD]
    type: HARD
    citation: "만 19세 이상 ∼ 만 34세 이하의 세대주(예비 세대주 포함)"
    human_reviewed: false
    failure_message: 세대주 또는 예비 세대주여야 함

  - rule_id: B-04
    field: home_ownership_status
    operator: eq
    value: NO_HOME_ALL_MEMBERS
    type: HARD
    citation: "세대주를 포함한 세대원 전원이 무주택인 자"
    human_reviewed: false
    failure_message: 세대원 중 주택을 보유한 사람이 있으면 신청 대상이 아님

  # 소득 기준 세 단. B-06·B-07이 특례이고 B-05가 일반이다.
  - rule_id: B-05
    field: combined_annual_income_krw
    operator: lte
    value: 50000000
    unit: 원
    type: HARD
    citation: "대출신청인과 배우자의 합산 총소득이 5천만원 이하인 자"
    human_reviewed: false
    failure_message: 부부합산 총소득이 5천만원을 넘음

  - rule_id: B-06
    field: combined_annual_income_krw
    operator: lte
    value: 60000000
    unit: 원
    type: HARD
    applies_when:
      field: minor_children_count
      operator: gte
      value: 2
    overrides: [B-05]
    citation: "다자녀·2자녀가구는 6천만원 이하"
    human_reviewed: false
    failure_message: 2자녀 이상 가구 기준 6천만원을 넘음

  - rule_id: B-07
    field: combined_annual_income_krw
    operator: lte
    value: 75000000
    unit: 원
    type: HARD
    applies_when:
      field: marital_status
      operator: eq
      value: NEWLYWED
    overrides: [B-05]
    citation: "신혼가구는 7.5천만원 이하"
    human_reviewed: false
    failure_message: 신혼가구 기준 7.5천만원을 넘음

  - rule_id: B-08
    field: net_asset_krw
    operator: lte
    value: 345000000
    unit: 원
    type: HARD
    citation: "합산 순자산 가액이 통계청에서 발표하는 최근년도 가계금융복지조사의 소득 3분위 전체가구 평균값 이하(십만원 단위에서 반올림)인 자 / 2026년도 기준 3.45억원"
    human_reviewed: false
    failure_message: 순자산이 3.45억원을 넘음
    note: 연도마다 바뀌는 값이다. 해가 바뀌면 원문을 다시 확인한다.

  # 전용면적 두 단. B-10이 특례이고 B-09가 일반이다.
  - rule_id: B-09
    field: housing_area_m2
    operator: lte
    value: 85
    unit: ㎡
    type: HARD
    citation: "임차 전용면적 85㎡ 이하 주택"
    human_reviewed: false
    failure_message: 전용면적이 85㎡를 넘음

  - rule_id: B-10
    field: housing_area_m2
    operator: lte
    value: 60
    unit: ㎡
    type: HARD
    applies_when:
      all:
        - field: age
          operator: lt
          value: 25
        - field: household_type
          operator: eq
          value: SINGLE
    overrides: [B-09]
    citation: "만 25세 미만 단독세대주는 60㎡ 이하"
    human_reviewed: false
    failure_message: 만 25세 미만 단독세대주는 전용면적 60㎡ 이하만 가능함

  - rule_id: B-11
    field: lease_deposit_krw
    operator: lte
    value: 300000000
    unit: 원
    type: HARD
    citation: "임차보증금 3억원 이하"
    human_reviewed: false
    failure_message: 임차보증금이 3억원을 넘음

# 통과·불통과가 아니라 금액을 구하는 값. 판정 엔진이 아니라 계산기가 쓴다.
limits:
  # 금액 상한과 비율 상한 중 작은 쪽을 적용하는 것으로 읽었으나 원문에 명시가 없다.
  # 검수 대기 항목이다.
  loan_amount:
    rule_id: B-12
    cap_krw: 150000000
    cap_krw_under_25_single: 120000000
    ratio_of_deposit: 0.80
    apply: MIN_OF_CAP_AND_RATIO
    citation: "1.5억원(만 25세 미만 단독세대주인 경우 1.2억원) 이내 / 전세금액의 80% 이내"
    human_reviewed: false

# 판정에 쓰지 않고 안내로만 보여 주는 값.
information:
  - rule_id: B-15
    label: 대출금리
    value: "연 2.2% ~ 3.3%"
    citation: "연 2.2%~3.3%"
    human_reviewed: false
  - rule_id: B-16
    label: 대출기간
    value: "2년 이내, 최장 10년"
    citation: "2년 이내(최장 10년 이용 가능)"
    human_reviewed: false

# 원문에서 확인하지 못한 것. 채워지기 전까지 판정에서 다루지 않는다.
unresolved:
  - "총소득이 세전인지 세후인지 페이지에 없음. 판정 결과가 갈리는 지점임"
  - "대출한도에서 금액 상한과 비율 상한 중 어느 쪽을 적용하는지 명시가 없음"
  - "신청 기한에 해당하는 조건이 페이지에 없음"
