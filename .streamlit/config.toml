# 실행 옵션을 파일로 못 박는다.
#
# 명령줄 플래그로만 두면 한 번 빼먹었을 때 그대로 노출된다. 신청자의 나이·소득·
# 자산을 다루는 화면이라 기본값을 쓰면 로컬 LLM을 쓰는 이유가 무너진다.

[server]
# 인증이 없다. 기본값은 전 인터페이스 바인딩이다.
address = "127.0.0.1"

[browser]
# 기본값은 사용 통계 전송이다.
gatherUsageStats = false

[client]
# 예외가 나면 Streamlit이 로컬 경로가 든 스택트레이스를 브라우저에 그린다.
# 데모 녹화에서 그대로 노출된다.
showErrorDetails = false
