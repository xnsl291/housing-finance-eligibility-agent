# 다음 질문 — 골든 시나리오
#
# "이 상태면 이걸 물어야 한다"를 적는다. 판정 골든(`golden/*.yaml`)이 "이 조건이면
# 이 판정"을 지키듯, 여기는 **질문 정책**을 지킨다. 정책을 바꾸면 여기가 깨지고,
# 깨진 케이스의 `왜`가 무엇이 달라졌는지 알려 준다.
#
# 상품 파일 하나에 묶이지 않고 세 상품을 한꺼번에 본다. 질문은 상품을 가로질러
# 정해지기 때문이다. 그래서 판정 골든과 폴더를 나눴다.
#
# 기본 프로필은 두 전세 상품을 모두 통과하는 사람이다. 시나리오마다 값을 빼거나
# 바꿔서 "무엇이 비었을 때 무엇을 묻는가"를 본다. `null`은 모른다는 뜻이다.

base:
  intended_tenure: JEONSE
  age: 29
  household_head_status: HEAD
  household_type: SINGLE
  home_ownership_status: NO_HOME_ALL_MEMBERS
  region_name: 서울
  housing_area_m2: 40
  deposit_paid_ratio: 0.1
  combined_annual_income_krw: 40000000
  net_asset_krw: 100000000
  lease_deposit_krw: 200000000
  contract_balance_date: "2026-10-01"
  move_in_date: "2026-10-01"
  application_date: "2026-10-10"

scenarios:
  # --- 1순위: 전세/매매 ---
  - name: 아무것도 모르면 전세인지 매매인지부터 묻는다
    왜: |
      이 값 하나로 볼 상품이 갈린다. 먼저 묻지 않으면 전세를 구하는 사람에게 매매
      상품의 주택가격까지 묻게 된다
    replace_base: true
    profile: {}
    expect:
      action: ASK
      field: intended_tenure

  - name: 전세/매매를 모른다고 하면 세 상품 공통 항목을 묻는다
    왜: |
      모른다고 한 것은 다시 묻지 않는다. 대신 세 상품이 모두 기다리는 항목으로 넘어가고,
      그중 고르기만 하면 되는 세대주 여부가 순자산보다 앞선다
    replace_base: true
    profile: {}
    declined: [intended_tenure]
    expect:
      action: ASK
      field: household_head_status
      needed_by: [nhuf-didimdol, nhuf-general-jeonse, nhuf-youth-jeonse]

  - name: 매매라고 하면 전세 상품 항목은 묻지 않는다
    왜: |
      후보가 디딤돌 하나로 줄어든다. 전세 상품만 쓰는 잔금일·전입일을 묻지 않는다
    replace_base: true
    profile:
      intended_tenure: PURCHASE
    expect:
      action: ASK
      field: household_head_status
      needed_by: [nhuf-didimdol]

  # --- 순위: 필요한 상품 수와 답하기 쉬운 정도 ---
  - name: 문장 하나를 넣은 뒤에는 두 전세 상품이 모두 기다리는 쉬운 항목부터
    왜: |
      "서울 전세 3억, 29살, 연봉 4천"을 넣은 상태다. 지금까지는 모르는 8개를 한꺼번에
      보여 줬다. 두 상품 모두 필요하고 고르기만 하면 되는 세대주 여부가 먼저다
    replace_base: true
    profile:
      intended_tenure: JEONSE
      age: 29
      region_name: 서울
      lease_deposit_krw: 300000000
      combined_annual_income_krw: 40000000
    expect:
      action: ASK
      field: household_head_status
      needed_by: [nhuf-general-jeonse, nhuf-youth-jeonse]

  - name: 수도권 여부가 아니라 지역명을 묻는다
    왜: |
      판정은 수도권 여부(region)가 없다고 알려 주지만 그건 코드가 지역명에서 만드는
      값이다. 사용자에게 "수도권인가요"를 물으면 경기도를 비수도권으로 답하는 일이
      생긴다(P-06). 원래 항목을 묻는다
    profile:
      age: 40
      employment_category: OTHER
      region_name: null
    expect:
      action: ASK
      field: region_name
      needed_by: [nhuf-general-jeonse]

  - name: 기준에 걸치는 값은 정확한 값을 다시 묻는다
    왜: |
      "4천 후반대"처럼 범위로만 알면 5천만원 기준을 걸친다. 없는 값과 묻는 말이 다르다 —
      "알려주세요"가 아니라 "정확히 알려주세요"다
    profile:
      combined_annual_income_krw: { low: 45000000, high: 55000000 }
    expect:
      action: ASK
      field: combined_annual_income_krw
      ask_kind: IMPRECISE

  # 아래 셋은 순위 기준 하나씩을 따로 지킨다. 다른 기준으로는 순서가 반대로 나오게
  # 골랐다 — 앞의 시나리오들은 여러 기준이 같은 답을 내서, 기준 하나를 지워도
  # 깨지지 않았다(2026-09-24 변형 시험).
  - name: 두 상품이 기다리는 항목이 한 상품만 기다리는 항목보다 앞선다
    왜: |
      지역명은 일반 전세만, 순자산은 두 전세 상품이 모두 기다린다. 답하기는 지역명이
      더 쉽지만 순자산을 먼저 묻는다 — 한 번 물어서 판정이 진행되는 상품이 더 많다
    profile:
      region_name: null
      net_asset_krw: null
    expect:
      action: ASK
      field: net_asset_krw
      needed_by: [nhuf-general-jeonse, nhuf-youth-jeonse]

  - name: 고르기만 하면 되는 항목이 숫자를 적어야 하는 항목보다 앞선다
    왜: |
      나이와 세대주 여부를 둘 다 모르고, 두 전세 상품이 모두 기다린다. 항목 정의
      순서로는 나이가 앞이지만 세대주 여부는 고르기만 하면 된다
    profile:
      age: null
      household_head_status: null
    expect:
      action: ASK
      field: household_head_status

  - name: 없는 값이 기준에 걸치는 값보다 앞선다
    왜: |
      소득은 범위로 알아 기준에 걸치고 순자산은 아예 모른다. 판정 엔진과 같은 순서다 —
      정밀도를 묻기 전에 없는 값부터 받는다
    profile:
      combined_annual_income_krw: { low: 45000000, high: 55000000 }
      net_asset_krw: null
    expect:
      action: ASK
      field: net_asset_krw
      ask_kind: MISSING

  # --- 종료 조건 ---
  - name: 모든 상품이 조건 불충족이면 더 묻지 않는다
    왜: |
      주택을 가진 사람은 세 상품 모두 안 된다. 여기서 소득이나 순자산을 더 물어도
      결과가 바뀌지 않는다
    replace_base: true
    profile:
      home_ownership_status: HAS_HOME
    expect:
      action: RESULT
      reason: ALL_NOT_MATCHED

  - name: 이미 탈락한 상품만 쓰는 항목은 묻지 않는다
    왜: |
      만 40세는 청년전용에서 탈락한다. 잔금일·전입일·신청일은 청년전용만 보는 값이라
      비어 있어도 물을 필요가 없다. **"남은 항목이 있다"와 "물어볼 값어치가 있다"는
      다르다**
    profile:
      age: 40
      employment_category: OTHER
      contract_balance_date: null
      move_in_date: null
      application_date: null
    expect:
      action: RESULT
      reason: COMPLETE

  - name: 다 알면 결과를 낸다
    왜: 두 전세 상품 모두 판정이 끝났다. 물을 것이 없다
    profile: {}
    expect:
      action: RESULT
      reason: COMPLETE

  - name: 모른다고 한 항목만 남으면 그 사실을 밝히고 결과를 낸다
    왜: |
      판정이 끝나지 않았는데 멈춘다. "물을 게 없어서 멈춤"과 구분해야 한다 — 화면이
      "순자산을 모르셔서 확정하지 못했습니다"라고 말할 수 있어야 한다(D-27)
    profile:
      net_asset_krw: null
    declined: [net_asset_krw]
    expect:
      action: RESULT
      reason: ONLY_DECLINED_LEFT
      declined_needed: [net_asset_krw]
