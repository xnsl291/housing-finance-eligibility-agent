# PR과 main 푸시마다 테스트·린트를 돌린다.
#
# `pull_request`에 대상 브랜치를 걸지 않는다. main으로 가는 PR만 돌리면, PR 위에
# PR을 쌓았을 때 위쪽 PR이 검증 없이 지나간다. 2026-09-16에 실제로 그렇게 됐다 —
# #12 위에 쌓은 #13에 체크가 하나도 안 붙었다.

name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pyproject.toml이 선언한 하한(>=3.12)으로 돌린다. 개발은 3.13에서 하므로
      # 여기서 3.12를 돌려야 하한 선언이 실제로 지켜지는지 확인된다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff check .

      - run: pytest
